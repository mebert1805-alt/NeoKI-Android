
name: Neo KI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projekt entpacken
        run: unzip -q NeoKI_Android_Projekt_v0.9.3_Bilder-1.zip -d projekt

      - name: Kotlin-JVM-Einstellung korrigieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          datei = Path('projekt/NeoKI/android/app/build.gradle.kts')
          text = datei.read_text(encoding='utf-8')
          muster = r'(?m)^[ \t]*kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}[ \t]*\n?'
          neu, anzahl = re.subn(muster, '', text)
          if anzahl != 1:
              raise SystemExit(f'Alte Kotlin-Einstellung nicht eindeutig gefunden: {anzahl} Treffer')

          neu += '''

          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''
          datei.write_text(neu, encoding='utf-8')
          print('Kotlin JVM 17: korrigiert')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK vorbereiten
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" \
            -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Neo KI APK bauen
        working-directory: projekt/NeoKI/android
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NeoKI-APK
          path: projekt/NeoKI/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
